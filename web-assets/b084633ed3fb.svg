<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ba lượng độc lập của lô thức ăn" viewBox="0 0 457 218"><title>Ba lượng độc lập của lô thức ăn</title><g fill="#382b23" font-family="Arial,sans-serif"><text x="12" y="25" font-size="19" font-weight="bold">Ba lượng độc lập của lô thức ăn</text><rect x="6" y="36" width="445" height="36" rx="4" fill="#f6dcc6" stroke="#784426" stroke-width="2"/><text x="14" y="61" font-size="15" font-weight="bold">Đại lượng</text><text x="299" y="61" font-size="15" font-weight="bold">Giá trị</text><text x="14" y="96" font-size="16" >Khối lượng thức ăn khô</text><text x="299" y="96" font-size="16" >5,0 kg</text><line x1="6" y1="104" x2="451" y2="104" stroke="#d5b49c" stroke-width="1"/><text x="14" y="130" font-size="16" >Nguyên liệu SCP khô trong lô</text><text x="299" y="130" font-size="16" >0,60 kg</text><line x1="6" y1="138" x2="451" y2="138" stroke="#d5b49c" stroke-width="1"/><text x="14" y="164" font-size="16" >Hàm lượng protein của SCP</text><text x="299" y="164" font-size="16" >45% chất khô</text><line x1="6" y1="172" x2="451" y2="172" stroke="#d5b49c" stroke-width="1"/><text x="14" y="198" font-size="16" >Protein toàn lô</text><text x="299" y="198" font-size="16" >1,20 kg</text><line x1="6" y1="206" x2="451" y2="206" stroke="#d5b49c" stroke-width="1"/></g></svg>
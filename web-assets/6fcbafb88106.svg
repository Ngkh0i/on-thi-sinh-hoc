<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Ba thẻ mô hình" viewBox="0 0 457 184"><title>Ba thẻ mô hình</title><g fill="#382b23" font-family="Arial,sans-serif"><text x="12" y="25" font-size="19" font-weight="bold">Ba thẻ mô hình</text><rect x="6" y="36" width="445" height="36" rx="4" fill="#f6dcc6" stroke="#784426" stroke-width="2"/><text x="14" y="61" font-size="15" font-weight="bold">Thẻ</text><text x="74" y="61" font-size="15" font-weight="bold">Dấu được ghi</text><text x="14" y="96" font-size="16" >A</text><text x="74" y="96" font-size="16" >Acid nucleic trong vỏ protein</text><line x1="6" y1="104" x2="451" y2="104" stroke="#d5b49c" stroke-width="1"/><text x="14" y="130" font-size="16" >B</text><text x="74" y="130" font-size="16" >RNA vòng nhỏ, không mã hóa, không capsid</text><line x1="6" y1="138" x2="451" y2="138" stroke="#d5b49c" stroke-width="1"/><text x="14" y="164" font-size="16" >C</text><text x="74" y="164" font-size="16" >Cùng chuỗi protein, khác cấu dạng làm khuôn</text><line x1="6" y1="172" x2="451" y2="172" stroke="#d5b49c" stroke-width="1"/></g></svg>
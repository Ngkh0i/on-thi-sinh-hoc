<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 530 236" role="img" aria-label="Vị trí A và B trên DNA ở ba mốc"><title>Vị trí A và B trên DNA ở ba mốc</title><desc>Ở G₁ có vòng MCM tại A và B. Đầu S, bóng sao chép mở quanh A. Sau đó bờ phải của bóng đi qua B; không thấy bóng riêng tại B.</desc><rect width="530" height="236" fill="#FFF8F1"/><g font-family="Arial,sans-serif" fill="#382b23"><text x="12" y="25" text-anchor="start" font-weight="700" font-size="18">Hai điểm trên cùng một phân tử DNA</text><text x="250" y="49" text-anchor="middle" font-weight="700" font-size="17">A</text><text x="385" y="49" text-anchor="middle" font-weight="700" font-size="17">B</text><line x1="250" y1="54" x2="250" y2="188" stroke="#c4a68c" stroke-width="1" stroke-dasharray="3 4"/><line x1="385" y1="54" x2="385" y2="188" stroke="#c4a68c" stroke-width="1" stroke-dasharray="3 4"/><text x="12" y="78" text-anchor="start" font-weight="400" font-size="17">Cuối G₁</text><line x1="115" y1="73" x2="512" y2="73" stroke="#664936" stroke-width="2" /><ellipse cx="250" cy="73" rx="8" ry="11" fill="none" stroke="#86401f" stroke-width="3"/><ellipse cx="385" cy="73" rx="8" ry="11" fill="none" stroke="#86401f" stroke-width="3"/><text x="12" y="130" text-anchor="start" font-weight="400" font-size="17">Đầu S</text><line x1="115" y1="125" x2="512" y2="125" stroke="#664936" stroke-width="2" /><path d="M211 125 Q250.0 92 289 125 Q250.0 158 211 125 Z" fill="#f0d2bd" stroke="#86401f" stroke-width="2"/><ellipse cx="385" cy="125" rx="8" ry="11" fill="none" stroke="#86401f" stroke-width="3"/><text x="12" y="181" text-anchor="start" font-weight="400" font-size="17">Sau đó</text><line x1="115" y1="176" x2="512" y2="176" stroke="#664936" stroke-width="2" /><path d="M142 176 Q286.5 143 431 176 Q286.5 209 142 176 Z" fill="#f0d2bd" stroke="#86401f" stroke-width="2"/><ellipse cx="19" cy="214" rx="8" ry="11" fill="none" stroke="#86401f" stroke-width="3"/><text x="37" y="220" text-anchor="start" font-weight="400" font
<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kiểm kê hoạt chất P" viewBox="0 0 452 184"><title>Kiểm kê hoạt chất P</title><g fill="#382b23" font-family="Arial,sans-serif"><text x="12" y="25" font-size="19" font-weight="bold">Kiểm kê hoạt chất P</text><rect x="6" y="36" width="440" height="36" rx="4" fill="#f6dcc6" stroke="#784426" stroke-width="2"/><text x="14" y="61" font-size="15" font-weight="bold">Mốc</text><text x="214" y="61" font-size="15" font-weight="bold">Số ghi trong sổ</text><text x="14" y="96" font-size="16" >Trước thu</text><text x="214" y="96" font-size="16" >1,50 L × 8,0 g P/L</text><line x1="6" y1="104" x2="446" y2="104" stroke="#d5b49c" stroke-width="1"/><text x="14" y="130" font-size="16" >Phần rắn sau thu</text><text x="214" y="130" font-size="16" >15,0 g, chứa 60% P</text><line x1="6" y1="138" x2="446" y2="138" stroke="#d5b49c" stroke-width="1"/><text x="14" y="164" font-size="16" >Sau hòa lại</text><text x="214" y="164" font-size="16" >0,50 L thể tích cuối</text><line x1="6" y1="172" x2="446" y2="172" stroke="#d5b49c" stroke-width="1"/></g></svg>
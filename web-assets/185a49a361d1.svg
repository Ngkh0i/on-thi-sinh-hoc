<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 522 131" role="img" aria-label="Hai mốc chọn mẫu"><title>Hai mốc chọn mẫu</title><rect x="0" y="0" width="522" height="131" fill="#fff8f1"/><text x="12" y="23" fill="#86401f" text-anchor="start" font-family="Arial, sans-serif" font-size="17" font-weight="bold">Hai mốc chọn mẫu</text><rect x="10" y="30" width="162" height="29" fill="#ead0b8"/><text x="16" y="50" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Mốc</text><rect x="172" y="30" width="340" height="29" fill="#ead0b8"/><text x="178" y="50" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold">Quy tắc</text><line x1="10" y1="61" x2="512" y2="61" stroke="#b89580" stroke-width="1"/><text x="16" y="81" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15">Khi nảy mầm</text><text x="178" y="81" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15">Chấm toàn bộ 320 cây</text><line x1="10" y1="92" x2="512" y2="92" stroke="#b89580" stroke-width="1"/><text x="16" y="112" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15">Sau chọn mẫu</text><text x="178" y="112" fill="#362a24" text-anchor="start" font-family="Arial, sans-serif" font-size="15">Giữ mọi cây màu, 50% cây trắng</text><line x1="10" y1="123" x2="512" y2="123" stroke="#b89580" stroke-width="1"/></svg>